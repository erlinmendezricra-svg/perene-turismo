<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      transform: scale(1.8) !important;
      transform-origin: center center !important;
      z-index: 1 !important;
      display: block !important;
    }

    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 2 !important;
      background: transparent !important;
    }

    .a-enter-vr, .arjs-loader { display: none !important; }

    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
    }

    .mensaje-guia {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      text-align: center;
      max-width: 85%;
    }

    .panel-botones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 98%;
    }

    .panel-girar {
      position: fixed;
      bottom: calc(max(80px, env(safe-area-inset-bottom)) + 5px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
    }

    .panel-mover {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 999;
    }

    .btn {
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
      z-index: 999;
    }
    .btn:active { transform: scale(0.95); }
    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
    .btn-animal { background: #f59e0b; color: #1f2937; }
    .btn-girar { background: #7c3aed; color: white; }
    .btn-mover { background: #0891b2; color: white; }
    .btn-grabar.grabando { background: #7f1d1d; animation: parpadeo 1s infinite; }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .lista-animales {
      position: fixed;
      bottom: calc(max(120px, env(safe-area-inset-bottom)) + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 12px;
      z-index: 999;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 92%;
    }
    .lista-animales.mostrar { display: flex; }
    .animal-opcion {
      background: #006633;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .animal-opcion.activo { background: #16a34a; outline: 2px solid white; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  <div class="mensaje-guia">📷 Apunta al marcador — Caballo quieto, tú lo mueves</div>

  <!-- Botones para MOVER el caballo (lado derecho) -->
  <div class="panel-mover">
    <button class="btn btn-mover" id="btnArriba">⬆️</button>
    <button class="btn btn-mover" id="btnIzquierda">⬅️</button>
    <button class="btn btn-mover" id="btnAcercar">🔍+</button>
    <button class="btn btn-mover" id="btnDerecha">➡️</button>
    <button class="btn btn-mover" id="btnAbajo">⬇️</button>
    <button class="btn btn-mover" id="btnAlejar">🔍-</button>
  </div>

  <!-- Botones para GIRAR el caballo (abajo) -->
  <div class="panel-girar">
    <button class="btn btn-girar" id="btnGirarIzq">↺ Izquierda</button>
    <button class="btn btn-girar" id="btnFrente">🔄 Frente</button>
    <button class="btn btn-girar" id="btnGirarDer">↻ Derecha</button>
  </div>

  <!-- Botones principales -->
  <div class="panel-botones">
    <button class="btn btn-anim" id="btnAnimacion">▶️ Mover</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
    <button class="btn btn-animal" id="btnAnimal">🐾 Modelos</button>
  </div>

  <div class="lista-animales" id="listaAnimales">
    <button class="animal-opcion activo" data-modelo="/ar/logo.glb">🐎 Caballo</button>
    <button class="animal-opcion" data-modelo="/ar/logos.glb">🦄 Segundo Modelo</button>
  </div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="modelo-actual" src="/ar/logo.glb"></a-asset-item>
    </a-assets>

    <!-- CABALLO ESTABLE — SIN ANIMACIÓN AUTOMÁTICA, QUIETO -->
    <a-entity
      id="entidadModelo"
      scale="0.35 0.35 0.35"
      position="0 -1.0 -2.2"
      rotation="0 0 0"
      gltf-model="#modelo-actual">
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    const modeloEntidad = document.getElementById('entidadModelo');
    const btnAnimacion = document.getElementById('btnAnimacion');
    
    // VALORES INICIALES
    let posX = 0;
    let posY = -1.0;
    let posZ = -2.2;
    let rotacionY = 0;
    let animacionActiva = false;

    // ACTUALIZAR POSICIÓN Y ROTACIÓN
    function actualizarPosicion() {
      modeloEntidad.setAttribute('position', `${posX} ${posY} ${posZ}`);
      modeloEntidad.setAttribute('rotation', `0 ${rotacionY} 0`);
    }

    // GIRAR
    document.getElementById('btnGirarIzq').addEventListener('click', () => {
      rotacionY -= 45;
      actualizarPosicion();
    });
    document.getElementById('btnGirarDer').addEventListener('click', () => {
      rotacionY += 45;
      actualizarPosicion();
    });
    document.getElementById('btnFrente').addEventListener('click', () => {
      rotacionY = 0;
      actualizarPosicion();
    });

    // MOVER
    document.getElementById('btnArriba').addEventListener('click', () => {
      posY += 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnAbajo').addEventListener('click', () => {
      posY -= 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnIzquierda').addEventListener('click', () => {
      posX -= 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnDerecha').addEventListener('click', () => {
      posX += 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnAcercar').addEventListener('click', () => {
      posZ += 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnAlejar').addEventListener('click', () => {
      posZ -= 0.2;
      actualizarPosicion();
    });

    // ANIMACIÓN — SOLO CUANDO TÚ LO ACTIVES
    btnAnimacion.addEventListener('click', () => {
      animacionActiva = !animacionActiva;
      if (animacionActiva) {
        modeloEntidad.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
        btnAnimacion.textContent = '⏸ Quieto';
      } else {
        modeloEntidad.removeAttribute('animation-mixer');
        btnAnimacion.textContent = '▶️ Mover';
      }
    });

    // GRABAR
    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false, grabadora = null;
    btnGrabar.addEventListener('click', async () => {
      if (!grabando) {
        try {
          const flujo = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false});
          grabadora = new MediaRecorder(flujo);
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, {type: 'video/webm'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'perene-' + Date.now() + '.webm';
            a.click();
            flujo.getTracks().forEach(t => t.stop());
          };
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
        } catch {
          alert('Permite grabar pantalla cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });

    // CAMBIAR DE MODELO
    const btnAnimal = document.getElementById('btnAnimal');
    const listaAnimales = document.getElementById('listaAnimales');
    const modeloActual = document.getElementById('modelo-actual');
    
    btnAnimal.addEventListener('click', () => listaAnimales.classList.toggle('mostrar'));
    
    document.querySelectorAll('.animal-opcion').forEach(boton => {
      boton.addEventListener('click', function() {
        document.querySelectorAll('.animal-opcion').forEach(b => b.classList.remove('activo'));
        this.classList.add('activo');
        
        const archivo = this.getAttribute('data-modelo');
        modeloActual.setAttribute('src', archivo);
        
        // DEJAR QUIETO AL CAMBIAR DE MODELO
        animacionActiva = false;
        modeloEntidad.removeAttribute('animation-mixer');
        btnAnimacion.textContent = '▶️ Mover';
        
        btnAnimal.textContent = '🐾 ' + this.textContent.trim();
        listaAnimales.classList.remove('mostrar');
      });
    });
  </script>
</body>
</html>
