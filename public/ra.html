<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 2 !important;
      background: transparent !important;
    }
    .a-enter-vr, .arjs-loader { display: none !important; }
    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
    }
    .mensaje-guia {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22,163,74,0.9);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 999;
      text-align: center;
    }
    .panel-botones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 98%;
    }
    .panel-girar {
      position: fixed;
      bottom: calc(max(80px, env(safe-area-inset-bottom)) + 5px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
    }
    .panel-mover {
      position: fixed;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 999;
    }
    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
      z-index: 999;
    }
    .btn:active { transform: scale(0.95); }
    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
    .btn-girar { background: #7c3aed; color: white; }
    .btn-mover { background: #0891b2; color: white; }
    .btn-leona { background: #eab308; color: white; }
    .btn-saurio { background: #f97316; color: white; }
    .activo { outline: 3px solid white; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  <div class="mensaje-guia">🦁🦖 Elige el modelo — cámara igual ✅</div>

  <!-- Botones MOVER -->
  <div class="panel-mover">
    <button class="btn btn-mover" id="btnArriba">⬆️</button>
    <button class="btn btn-mover" id="btnIzquierda">⬅️</button>
    <button class="btn btn-mover" id="btnAcercar">🔍+</button>
    <button class="btn btn-mover" id="btnDerecha">➡️</button>
    <button class="btn btn-mover" id="btnAbajo">⬇️</button>
    <button class="btn btn-mover" id="btnAlejar">🔍-</button>
  </div>

  <!-- Botones GIRAR -->
  <div class="panel-girar">
    <button class="btn btn-girar" id="btnGirarIzq">↺ Izq</button>
    <button class="btn btn-girar" id="btnFrente">🔄 Frente</button>
    <button class="btn btn-girar" id="btnGirarDer">↻ Der</button>
  </div>

  <!-- Botones de modelo + acciones -->
  <div class="panel-botones">
    <button class="btn btn-leona activo" id="btnLeona">🦁 Leona</button>
    <button class="btn btn-saurio" id="btnSaurio">🦖 Saurio</button>
    <button class="btn btn-anim" id="btnAnimacion">▶️ Vivir</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
  </div>

  <!-- ✅ ESCENA — CÁMARA INTACTA, IGUAL QUE TENÍAS -->
  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="leona" src="/ar/leona.glb"></a-asset-item>
      <a-asset-item id="saurio" src="/ar/saurio.glb"></a-asset-item>
    </a-assets>

    <!-- 🦁 LEONA — tamaño controlado -->
    <a-entity
      id="entidadLeona"
      scale="0.6 0.6 0.6"
      position="0 0 -1.5"
      rotation="0 0 0"
      gltf-model="#leona">
    </a-entity>

    <!-- 🦖 SAURIO — mismo tamaño y posición -->
    <a-entity
      id="entidadSaurio"
      scale="0.6 0.6 0.6"
      position="0 0 -1.5"
      rotation="0 0 0"
      gltf-model="#saurio"
      visible="false">
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    const entidadLeona = document.getElementById('entidadLeona');
    const entidadSaurio = document.getElementById('entidadSaurio');
    const btnLeona = document.getElementById('btnLeona');
    const btnSaurio = document.getElementById('btnSaurio');
    const btnAnimacion = document.getElementById('btnAnimacion');
    
    let modeloActivo = 'leona';
    let posX = 0, posY = 0, posZ = -1.5;
    let rotacionY = 0;
    let animacionActiva = false;

    function getModeloActivo() {
      return modeloActivo === 'leona' ? entidadLeona : entidadSaurio;
    }

    function actualizarPosicion() {
      const m = getModeloActivo();
      m.setAttribute('position', `${posX} ${posY} ${posZ}`);
      m.setAttribute('rotation', `0 ${rotacionY} 0`);
    }

    // CAMBIAR MODELO
    btnLeona.addEventListener('click', () => {
      entidadLeona.setAttribute('visible', 'true');
      entidadSaurio.setAttribute('visible', 'false');
      modeloActivo = 'leona';
      btnLeona.classList.add('activo');
      btnSaurio.classList.remove('activo');
      // Restaurar posición
      posX = 0; posY = 0; posZ = -1.5; rotacionY = 0;
      actualizarPosicion();
    });

    btnSaurio.addEventListener('click', () => {
      entidadLeona.setAttribute('visible', 'false');
      entidadSaurio.setAttribute('visible', 'true');
      modeloActivo = 'saurio';
      btnSaurio.classList.add('activo');
      btnLeona.classList.remove('activo');
      // Restaurar posición
      posX = 0; posY = 0; posZ = -1.5; rotacionY = 0;
      actualizarPosicion();
    });

    // GIRAR
    document.getElementById('btnGirarIzq').addEventListener('click', () => {
      rotacionY -= 30; actualizarPosicion();
    });
    document.getElementById('btnGirarDer').addEventListener('click', () => {
      rotacionY += 30; actualizarPosicion();
    });
    document.getElementById('btnFrente').addEventListener('click', () => {
      rotacionY = 0; actualizarPosicion();
    });

    // MOVER
    document.getElementById('btnArriba').addEventListener('click', () => {
      posY += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAbajo').addEventListener('click', () => {
      posY -= 0.15; actualizarPosicion();
    });
    document.getElementById('btnIzquierda').addEventListener('click', () => {
      posX -= 0.15; actualizarPosicion();
    });
    document.getElementById('btnDerecha').addEventListener('click', () => {
      posX += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAcercar').addEventListener('click', () => {
      posZ += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAlejar').addEventListener('click', () => {
      posZ -= 0.15; actualizarPosicion();
    });

    // ANIMACIÓN
    btnAnimacion.addEventListener('click', () => {
      animacionActiva = !animacionActiva;
      const m = getModeloActivo();
      if (animacionActiva) {
        m.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 0.8');
        btnAnimacion.textContent = '⏸ Quieto';
      } else {
        m.removeAttribute('animation-mixer');
        btnAnimacion.textContent = '▶️ Vivir';
      }
    });

    // GRABAR
    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false, grabadora = null;
    btnGrabar.addEventListener('click', async () => {
      if (!grabando) {
        try {
          const flujo = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false});
          grabadora = new MediaRecorder(flujo);
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, {type: 'video/webm'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `perene-${modeloActivo}-${Date.now()}.webm`;
            a.click();
            flujo.getTracks().forEach(t => t.stop());
          };
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
        } catch {
          alert('Permite grabar pantalla cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });
  </script>
</body>
</html>
