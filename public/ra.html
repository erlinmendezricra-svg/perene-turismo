<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
    }

    /* CÁMARA OCUPA TODO SIN RECORTES */
    .fondo-camara {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      z-index: 1;
      display: block;
    }

    /* BOTÓN VOLVER */
    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* MENSAJE GUÍA */
    .mensaje-guia {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      text-align: center;
      max-width: 85%;
      line-height: 1.3;
    }

    /* PANEL DE BOTONES ABAJO */
    .panel-botones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96%;
    }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }

    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
    .btn-animal { background: #f59e0b; color: #1f2937; }
    .btn-grabar.grabando { background: #7f1d1d; animation: parpadeo 1s infinite; }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* LISTA DE ANIMALES */
    .lista-animales {
      position: fixed;
      bottom: calc(max(70px, env(safe-area-inset-bottom) + 60px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 12px;
      z-index: 999;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 92%;
    }
    .lista-animales.mostrar { display: flex; }
    .animal-opcion {
      background: #006633;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      touch-action: manipulation;
    }
    .animal-opcion.activo { 
      background: #16a34a; 
      outline: 2px solid white;
    }

    /* ESCENA PANTALLA COMPLETA */
    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      background: transparent;
    }
    .a-enter-vr, .arjs-loader, .arjs-video { display: none !important; }
  </style>
</head>
<body>
  <video class="fondo-camara" autoplay playsinline muted id="camara"></video>

  <a href="/" class="btn-volver">← Volver</a>
  <div class="mensaje-guia">📷 Apunta al marcador para ver el modelo</div>

  <!-- PANEL DE BOTONES -->
  <div class="panel-botones">
    <button class="btn btn-anim" id="btnAnimacion">🔄 Animación</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
    <button class="btn btn-animal" id="btnAnimal">🐾 Animal</button>
  </div>

  <!-- LISTA DE ANIMALES -->
  <div class="lista-animales" id="listaAnimales">
    <button class="animal-opcion activo" data-modelo="/ar/logo.glb">Caballo</button>
    <!-- Agrega más: <button class="animal-opcion" data-modelo="/ar/nombre.glb">Nombre</button> -->
  </div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <a-asset-item id="modelo-actual" src="/ar/logo.glb"></a-asset-item>
    </a-assets>

    <!-- MODELO CENTRADO, COMPLETO Y ESTABLE -->
    <a-entity 
      id="entidadModelo"
      scale="0.35 0.35 0.35" 
      position="0 -0.3 -2.2"
      gltf-model="#modelo-actual"
      animation-mixer="clip: *; loop: repeat; timeScale: 1">
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    // === ACTIVAR CÁMARA PANTALLA COMPLETA ===
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'environment', 
        width: { ideal: 1920 }, 
        height: { ideal: 1080 } 
      } 
    })
    .then(function(stream) {
      const video = document.getElementById('camara');
      video.srcObject = stream;
      video.play();
    })
    .catch(function(err) {
      console.log('Error de cámara:', err);
    });

    // === CAMBIAR ANIMACIÓN ===
    const btnAnimacion = document.getElementById('btnAnimacion');
    const modeloEntidad = document.getElementById('entidadModelo');
    let indiceAnimacion = 0;

    btnAnimacion.addEventListener('click', function() {
      const mixer = modeloEntidad.components['animation-mixer'];
      if (!mixer) {
        alert('Espera un momento a que cargue el modelo');
        return;
      }

      const animaciones = Object.keys(mixer.model?.animations || {});
      
      if (animaciones.length === 0) {
        const velocidad = modeloEntidad.getAttribute('animation-mixer').timeScale;
        if (velocidad === 1) {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 0.5);
          btnAnimacion.textContent = '🐢 Lenta';
        } else if (velocidad === 0.5) {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 1.5);
          btnAnimacion.textContent = '🐇 Rápida';
        } else {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 1);
          btnAnimacion.textContent = '🔄 Normal';
        }
        return;
      }

      indiceAnimacion = (indiceAnimacion + 1) % (animaciones.length + 1);
      
      if (indiceAnimacion === 0) {
        modeloEntidad.setAttribute('animation-mixer', 'clip', '*');
        btnAnimacion.textContent = '🔄 Todas';
      } else {
        const anim = animaciones[indiceAnimacion - 1];
        modeloEntidad.setAttribute('animation-mixer', 'clip', anim);
        btnAnimacion.textContent = '🎬 ' + anim.substring(0, 10);
      }
    });

    // === GRABAR PANTALLA ===
    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false;
    let grabadora = null;
    let flujoGrabacion = null;

    btnGrabar.addEventListener('click', async function() {
      if (!grabando) {
        try {
          flujoGrabacion = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always' },
            audio: false
          });
          
          grabadora = new MediaRecorder(flujoGrabacion, {
            mimeType: 'video/webm'
          });
          
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'perene-turismo-' + new Date().toLocaleTimeString().replace(/:/g, '-') + '.webm';
            a.click();
            URL.revokeObjectURL(url);
            flujoGrabacion.getTracks().forEach(t => t.stop());
          };
          
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
          
        } catch (e) {
          alert('Permite grabar cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });

    // === ELEGIR OTRO ANIMAL ===
    const btnAnimal = document.getElementById('btnAnimal');
    const listaAnimales = document.getElementById('listaAnimales');
    const modeloActual = document.getElementById('modelo-actual');
    const opcionesAnimales = document.querySelectorAll('.animal-opcion');

    btnAnimal.addEventListener('click', function() {
      listaAnimales.classList.toggle('mostrar');
    });

    opcionesAnimales.forEach(boton => {
      boton.addEventListener('click', function() {
        opcionesAnimales.forEach(op => op.classList.remove('activo'));
        this.classList.add('activo');
        
        const ruta = this.getAttribute('data-modelo');
        modeloActual.setAttribute('src', ruta);
        
        setTimeout(() => {
          modeloEntidad.removeAttribute('gltf-model');
          modeloEntidad.setAttribute('gltf-model', '#modelo-actual');
        }, 150);
        
        listaAnimales.classList.remove('mostrar');
        btnAnimal.textContent = '🐾 ' + this.textContent;
      });
    });
  </script>
</body>
</html>
