<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- ESTA LÍNEA ES LA MÁS IMPORTANTE PARA QUE NO SE VEA GIGANTE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* NADA DE DESLIZAR, TODO EN PANTALLA */
      position: fixed; /* FIJA LA PANTALLA PARA QUE NO SE MUEVA */
    }
    body {
      background-color: #000;
    }
    /* EL CONTENEDOR DE LA CÁMARA OCUPA EXACTAMENTE LA PANTALLA */
    #ar-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    video, canvas, .arjs-video, .a-canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important; /* AJUSTA SIN DEFORMAR */
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
    /* EL MENSAJE DE GUÍA */
    .mensaje-guia {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      z-index: 100;
      text-align: center;
      max-width: 90%;
    }
    /* BOTÓN VOLVER */
    .btn-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #006633;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 100;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver la información</div>
  
  <div id="ar-container">
    <!-- Aquí va tu código de Realidad Aumentada -->
    <!-- ... mantén tu código de AR aquí ... -->
  </div>
</body>
</html>
