<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RA Perené</title>

  <!-- ✅ LIBRERÍAS DESDE INTERNET (NO necesitas tenerlas en tu carpeta) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }
    .a-enter-vr { display:none !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./ar/targets.mind; maxTrack:1; uiLoading:yes; uiScanning:yes; cameraDefault:true;"
    vr-mode-ui="enabled:false">
    
    <a-assets>
      <a-asset-item id="leona" src="./ar/Leona.glb"></a-asset-item>
    </a-assets>

    <a-camera></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity position="0 0 -1" scale="0.3 0.3 0.3" rotation="-90 0 0" gltf-model="#leona" animation-mixer="loop:repeat"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
