<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Perené</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .indicacion {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      z-index: 100;
      text-align: center;
      font-size: 0.95rem;
    }
    .volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #006633;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      z-index: 100;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <a href="/" class="volver">← Volver</a>
  <p class="indicacion">📷 Apunta a la imagen del atractivo para ver la información</p>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <!-- Aquí se cargará la imagen del atractivo -->
    </a-assets>

    <!-- Marcador dinámico según el atractivo -->
    <a-marker preset="hiro">
      <a-entity id="contenido-ra">
        <!-- Aquí aparecerá la info en pantalla -->
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Cargar datos del atractivo
    const id = window.location.pathname.split('/').pop();
    
    fetch(`/api/lugar/${id}`)
      .then(res => res.json())
      .then(lugar => {
        const contenido = document.getElementById('contenido-ra');
        
        contenido.innerHTML = `
          <!-- Título flotante -->
          <a-text 
            value="${lugar.nombre}" 
            scale="1.5 1.5 1.5" 
            position="0 1.5 0" 
            color="#00ff88"
            align="center"
            font="monoid"></a-text>
          
          <!-- Descripción flotante -->
          <a-text 
            value="${(lugar.descripcion || '').substring(0, 60)}..." 
            scale="0.6 0.6 0.6" 
            position="0 1.0 0" 
            color="white"
            align="center"
            width="8"></a-text>
          
          <!-- Ubicación -->
          <a-text 
            value="📍 ${lugar.ubicacion || 'Perené'}" 
            scale="0.5 0.5 0.5" 
            position="0 0.5 0" 
            color="#ffcc00"
            align="center"
            width="6"></a-text>
          
          <!-- Caja decorativa verde -->
          <a-box 
            position="0 1.0 -0.5" 
            scale="4 2 0.1" 
            color="#006633" 
            opacity="0.6"></a-box>
        `;
      })
      .catch(err => {
        console.error('Error RA:', err);
      });
  </script>

</body>
</html>
