<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
    }

    /* La cámara de AR.js se ve completa */
    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      background: transparent;
    }
    .a-enter-vr, .arjs-loader { display: none !important; }
    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }

    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .mensaje-guia {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      text-align: center;
      max-width: 85%;
    }

    .panel-botones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 96%;
    }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
      z-index: 999;
    }
    .btn:active { transform: scale(0.95); }

    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
    .btn-animal { background: #f59e0b; color: #1f2937; }
    .btn-grabar.grabando { background: #7f1d1d; animation: parpadeo 1s infinite; }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .lista-animales {
      position: fixed;
      bottom: calc(max(70px, env(safe-area-inset-bottom) + 60px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 12px;
      z-index: 999;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 92%;
    }
    .lista-animales.mostrar { display: flex; }
    .animal-opcion {
      background: #006633;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .animal-opcion.activo { 
      background: #16a34a; 
      outline: 2px solid white;
    }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  <div class="mensaje-guia">📷 Apunta al marcador para ver el caballo</div>

  <div class="panel-botones">
    <button class="btn btn-anim" id="btnAnimacion">🔄 Animación</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
    <button class="btn btn-animal" id="btnAnimal">🐾 Animal</button>
  </div>

  <div class="lista-animales" id="listaAnimales">
    <button class="animal-opcion activo" data-modelo="/ar/logo.glb">Caballo</button>
  </div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="modelo-actual" src="/ar/logo.glb"></a-asset-item>
    </a-assets>

    <!-- CABALLO COMPLETO, CENTRADO, QUIETO -->
    <a-entity 
      id="entidadModelo"
      scale="0.22 0.22 0.22" 
      position="0 -1.2 -2.8"
      gltf-model="#modelo-actual"
      animation-mixer="clip: *; loop: repeat; timeScale: 1"
      visible="true">
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    const modeloEntidad = document.getElementById('entidadModelo');
    const btnAnimacion = document.getElementById('btnAnimacion');

    // === CAMBIAR ANIMACIÓN ===
    btnAnimacion.addEventListener('click', () => {
      const mixer = modeloEntidad.components['animation-mixer'];
      
      if (!mixer || !mixer.model || !mixer.model.animations.length) {
        const velocidad = modeloEntidad.getAttribute('animation-mixer').timeScale || 1;
        if (velocidad === 1) {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 0.5);
          btnAnimacion.textContent = '🐢 Lenta';
        } else if (velocidad === 0.5) {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 1.5);
          btnAnimacion.textContent = '🐇 Rápida';
        } else {
          modeloEntidad.setAttribute('animation-mixer', 'timeScale', 1);
          btnAnimacion.textContent = '🔄 Normal';
        }
        return;
      }

      const animaciones = mixer.model.animations;
      let indiceAnimacion = 0;
      indiceAnimacion = (indiceAnimacion + 1) % (animaciones.length + 1);
      
      if (indiceAnimacion === 0) {
        modeloEntidad.setAttribute('animation-mixer', 'clip', '*');
        btnAnimacion.textContent = '🔄 Todas';
      } else {
        const anim = animaciones[indiceAnimacion - 1];
        modeloEntidad.setAttribute('animation-mixer', 'clip', anim.name);
        btnAnimacion.textContent = '🎬 ' + anim.name.substring(0, 10);
      }
    });

    // === GRABAR PANTALLA ===
    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false;
    let grabadora = null;

    btnGrabar.addEventListener('click', async () => {
      if (!grabando) {
        try {
          const flujo = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
          grabadora = new MediaRecorder(flujo);
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'perene-' + Date.now() + '.webm';
            a.click();
            flujo.getTracks().forEach(t => t.stop());
          };
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
        } catch (e) {
          alert('Permite grabar pantalla cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });

    // === ELEGIR OTRO ANIMAL ===
    const btnAnimal = document.getElementById('btnAnimal');
    const listaAnimales = document.getElementById('listaAnimales');
    const modeloActual = document.getElementById('modelo-actual');

    btnAnimal.addEventListener('click', () => {
      listaAnimales.classList.toggle('mostrar');
    });

    document.querySelectorAll('.animal-opcion').forEach(boton => {
      boton.addEventListener('click', function() {
        document.querySelectorAll('.animal-opcion').forEach(op => op.classList.remove('activo'));
        this.classList.add('activo');
        modeloActual.setAttribute('src', this.getAttribute('data-modelo'));
        btnAnimal.textContent = '🐾 ' + this.textContent;
        listaAnimales.classList.remove('mostrar');
      });
    });
  </script>
</body>
</html>
