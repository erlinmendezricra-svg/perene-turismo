<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
    }
    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1;
    }
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2;
    }
    .a-enter-vr, .arjs-loader { display: none !important; }
    .btn-volver {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 100;
      border: none;
    }
    .mensaje-guia {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22,163,74,0.9);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 100;
      text-align: center;
    }
    .panel-botones {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .panel-girar {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .panel-mover {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 100;
    }
    .btn:active { transform: scale(0.95); }
    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
    .btn-girar { background: #7c3aed; color: white; }
    .btn-mover { background: #0891b2; color: white; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  <div class="mensaje-guia">🦁 LA LEONA ESTÁ AQUÍ → Toca 🔍+ si no la ves</div>

  <div class="panel-mover">
    <button class="btn btn-mover" id="btnArriba">⬆️</button>
    <button class="btn btn-mover" id="btnIzquierda">⬅️</button>
    <button class="btn btn-mover" id="btnAcercar">🔍+</button>
    <button class="btn btn-mover" id="btnDerecha">➡️</button>
    <button class="btn btn-mover" id="btnAbajo">⬇️</button>
    <button class="btn btn-mover" id="btnAlejar">🔍-</button>
  </div>

  <div class="panel-girar">
    <button class="btn btn-girar" id="btnGirarIzq">Izg</button>
    <button class="btn btn-girar" id="btnFrente">Frente</button>
    <button class="btn btn-girar" id="btnGirarDer">Der</button>
  </div>

  <div class="panel-botones">
    <button class="btn btn-anim" id="btnAnimacion">Quieto</button>
    <button class="btn btn-grabar" id="btnGrabar">Grabar</button>
  </div>

  <!-- ✅ SIN MARCADOR — LEONA DIRECTA, VISIBLE Y CERCA -->
  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="leona" src="/ar/leona.glb"></a-asset-item>
    </a-assets>

    <!-- 🦁 MUY GRANDE, MUY CERCA → NO SE PIERDE -->
    <a-entity
      id="entidadLeona"
      scale="2 2 2"
      position="0 1 -2"
      rotation="0 0 0"
      gltf-model="#leona">
    </a-entity>

    <a-camera fov="60"></a-camera>
  </a-scene>

  <script>
    const modeloEntidad = document.getElementById('entidadLeona');
    const btnAnimacion = document.getElementById('btnAnimacion');
    
    let posX = 0;
    let posY = 1;
    let posZ = -2;
    let rotacionY = 0;
    let animacionActiva = false;

    function actualizarPosicion() {
      modeloEntidad.setAttribute('position', `${posX} ${posY} ${posZ}`);
      modeloEntidad.setAttribute('rotation', `0 ${rotacionY} 0`);
    }

    document.getElementById('btnGirarIzq').addEventListener('click', () => {
      rotacionY -= 30;
      actualizarPosicion();
    });
    document.getElementById('btnGirarDer').addEventListener('click', () => {
      rotacionY += 30;
      actualizarPosicion();
    });
    document.getElementById('btnFrente').addEventListener('click', () => {
      rotacionY = 0;
      actualizarPosicion();
    });

    document.getElementById('btnArriba').addEventListener('click', () => {
      posY += 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnAbajo').addEventListener('click', () => {
      posY -= 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnIzquierda').addEventListener('click', () => {
      posX -= 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnDerecha').addEventListener('click', () => {
      posX += 0.2;
      actualizarPosicion();
    });
    document.getElementById('btnAcercar').addEventListener('click', () => {
      posZ += 0.3;
      actualizarPosicion();
    });
    document.getElementById('btnAlejar').addEventListener('click', () => {
      posZ -= 0.3;
      actualizarPosicion();
    });

    btnAnimacion.addEventListener('click', () => {
      animacionActiva = !animacionActiva;
      if (animacionActiva) {
        modeloEntidad.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 0.8');
        btnAnimacion.textContent = 'Vivir';
      } else {
        modeloEntidad.removeAttribute('animation-mixer');
        btnAnimacion.textContent = 'Quieto';
      }
    });
  </script>
</body>
</html>
