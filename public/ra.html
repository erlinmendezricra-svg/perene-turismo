<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 2 !important;
      background: transparent !important;
    }
    .a-enter-vr, .arjs-loader { display: none !important; }

    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
    }

    /* Botones de animales ARRIBA */
    .panel-animales {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 95%;
    }
    .btn-animal {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    .btn-leona { background: #eab308; color: #1f1f1f; }
    .btn-saurio { background: #f97316; color: white; }
    .btn-lobo   { background: #6366f1; color: white; }
    .btn-coco   { background: #10b981; color: white; }
    .btn-conejo { background: #ec4899; color: white; }
    .btn-animal.activo {
      outline: 3px solid white;
      transform: scale(1.05);
    }

    .mensaje-guia {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 999;
      text-align: center;
    }

    .panel-mover {
      position: fixed;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 999;
    }
    .panel-girar {
      position: fixed;
      bottom: calc(max(80px, env(safe-area-inset-bottom)) + 5px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
    }
    .panel-acciones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 999;
    }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
      z-index: 999;
    }
    .btn:active { transform: scale(0.95); }
    .btn-mover { background: #0891b2; color: white; }
    .btn-girar { background: #7c3aed; color: white; }
    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>

  <!-- ✅ TODOS LOS ANIMALES EN BOTONES -->
  <div class="panel-animales">
    <button class="btn-animal btn-leona activo" id="btnLeona">🦁 Leona</button>
    <button class="btn-animal btn-saurio" id="btnSaurio">🦖 Saurio</button>
    <button class="btn-animal btn-lobo" id="btnLobo">🐺 Lobo</button>
    <button class="btn-animal btn-coco" id="btnCoco">🐊 Coco</button>
    <button class="btn-animal btn-conejo" id="btnConejo">🐰 Conejo</button>
  </div>

  <div class="mensaje-guia">📷 Cámara activa — toca el animal que quieras ver</div>

  <!-- Botones MOVER derecha -->
  <div class="panel-mover">
    <button class="btn btn-mover" id="btnArriba">⬆️</button>
    <button class="btn btn-mover" id="btnIzquierda">⬅️</button>
    <button class="btn btn-mover" id="btnAcercar">🔍+</button>
    <button class="btn btn-mover" id="btnDerecha">➡️</button>
    <button class="btn btn-mover" id="btnAbajo">⬇️</button>
    <button class="btn btn-mover" id="btnAlejar">🔍-</button>
  </div>

  <!-- Botones GIRAR abajo centro -->
  <div class="panel-girar">
    <button class="btn btn-girar" id="btnGirarIzq">↺ Izq</button>
    <button class="btn btn-girar" id="btnFrente">🔄 Frente</button>
    <button class="btn btn-girar" id="btnGirarDer">↻ Der</button>
  </div>

  <!-- Botones ACCIONES abajo -->
  <div class="panel-acciones">
    <button class="btn btn-anim" id="btnAnimacion">▶️ Vivir</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
  </div>

  <!-- ✅ ESCENA CON TODOS LOS ANIMALES -->
  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item id="leona" src="/ar/leona.glb"></a-asset-item>
      <a-asset-item id="saurio" src="/ar/saurio.glb"></a-asset-item>
      <a-asset-item id="lobo" src="/ar/lobo.glb"></a-asset-item>
      <a-asset-item id="coco" src="/ar/cocodrilo.glb"></a-asset-item>
      <a-asset-item id="conejo" src="/ar/conejo.glb"></a-asset-item>
    </a-assets>

    <!-- 🦁 LEONA -->
    <a-entity id="entidadLeona" scale="1 1 1" position="0 0 -1.5" rotation="0 0 0" gltf-model="#leona"></a-entity>

    <!-- 🦖 SAURIO -->
    <a-entity id="entidadSaurio" scale="1 1 1" position="0 0 -1.5" rotation="0 0 0" gltf-model="#saurio" visible="false"></a-entity>

    <!-- 🐺 LOBO -->
    <a-entity id="entidadLobo" scale="1 1 1" position="0 0 -1.5" rotation="0 0 0" gltf-model="#lobo" visible="false"></a-entity>

    <!-- 🐊 COCODRILO -->
    <a-entity id="entidadCoco" scale="1 1 1" position="0 0 -1.5" rotation="0 0 0" gltf-model="#coco" visible="false"></a-entity>

    <!-- 🐰 CONEJO -->
    <a-entity id="entidadConejo" scale="1 1 1" position="0 0 -1.5" rotation="0 0 0" gltf-model="#conejo" visible="false"></a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    // Todas las entidades
    const entidadLeona = document.getElementById('entidadLeona');
    const entidadSaurio = document.getElementById('entidadSaurio');
    const entidadLobo = document.getElementById('entidadLobo');
    const entidadCoco = document.getElementById('entidadCoco');
    const entidadConejo = document.getElementById('entidadConejo');

    // Botones de animales
    const btnLeona = document.getElementById('btnLeona');
    const btnSaurio = document.getElementById('btnSaurio');
    const btnLobo = document.getElementById('btnLobo');
    const btnCoco = document.getElementById('btnCoco');
    const btnConejo = document.getElementById('btnConejo');

    const btnAnimacion = document.getElementById('btnAnimacion');
    
    let modeloActivo = 'leona';
    let posX = 0, posY = 0, posZ = -1.5;
    let rotacionY = 0;
    let animacionActiva = false;

    function getModeloActivo() {
      switch(modeloActivo) {
        case 'leona': return entidadLeona;
        case 'saurio': return entidadSaurio;
        case 'lobo': return entidadLobo;
        case 'coco': return entidadCoco;
        case 'conejo': return entidadConejo;
      }
    }

    function ocultarTodos() {
      entidadLeona.setAttribute('visible', 'false');
      entidadSaurio.setAttribute('visible', 'false');
      entidadLobo.setAttribute('visible', 'false');
      entidadCoco.setAttribute('visible', 'false');
      entidadConejo.setAttribute('visible', 'false');
      btnLeona.classList.remove('activo');
      btnSaurio.classList.remove('activo');
      btnLobo.classList.remove('activo');
      btnCoco.classList.remove('activo');
      btnConejo.classList.remove('activo');
      posX = 0; posY = 0; posZ = -1.5; rotacionY = 0;
      animacionActiva = false;
      btnAnimacion.textContent = '▶️ Vivir';
    }

    function actualizarPosicion() {
      const m = getModeloActivo();
      m.setAttribute('position', `${posX} ${posY} ${posZ}`);
      m.setAttribute('rotation', `0 ${rotacionY} 0`);
    }

    // CAMBIAR A CADA ANIMAL
    btnLeona.addEventListener('click', () => {
      ocultarTodos();
      entidadLeona.setAttribute('visible', 'true');
      btnLeona.classList.add('activo');
      modeloActivo = 'leona';
      actualizarPosicion();
    });

    btnSaurio.addEventListener('click', () => {
      ocultarTodos();
      entidadSaurio.setAttribute('visible', 'true');
      btnSaurio.classList.add('activo');
      modeloActivo = 'saurio';
      actualizarPosicion();
    });

    btnLobo.addEventListener('click', () => {
      ocultarTodos();
      entidadLobo.setAttribute('visible', 'true');
      btnLobo.classList.add('activo');
      modeloActivo = 'lobo';
      actualizarPosicion();
    });

    btnCoco.addEventListener('click', () => {
      ocultarTodos();
      entidadCoco.setAttribute('visible', 'true');
      btnCoco.classList.add('activo');
      modeloActivo = 'coco';
      actualizarPosicion();
    });

    btnConejo.addEventListener('click', () => {
      ocultarTodos();
      entidadConejo.setAttribute('visible', 'true');
      btnConejo.classList.add('activo');
      modeloActivo = 'conejo';
      actualizarPosicion();
    });

    // GIRAR
    document.getElementById('btnGirarIzq').addEventListener('click', () => {
      rotacionY -= 30; actualizarPosicion();
    });
    document.getElementById('btnGirarDer').addEventListener('click', () => {
      rotacionY += 30; actualizarPosicion();
    });
    document.getElementById('btnFrente').addEventListener('click', () => {
      rotacionY = 0; actualizarPosicion();
    });

    // MOVER
    document.getElementById('btnArriba').addEventListener('click', () => {
      posY += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAbajo').addEventListener('click', () => {
      posY -= 0.15; actualizarPosicion();
    });
    document.getElementById('btnIzquierda').addEventListener('click', () => {
      posX -= 0.15; actualizarPosicion();
    });
    document.getElementById('btnDerecha').addEventListener('click', () => {
      posX += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAcercar').addEventListener('click', () => {
      posZ += 0.15; actualizarPosicion();
    });
    document.getElementById('btnAlejar').addEventListener('click', () => {
      posZ -= 0.15; actualizarPosicion();
    });

    // ANIMACIÓN
    btnAnimacion.addEventListener('click', () => {
      animacionActiva = !animacionActiva;
      const m = getModeloActivo();
      if (animacionActiva) {
        m.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 0.8');
        btnAnimacion.textContent = '⏸ Quieto';
      } else {
        m.removeAttribute('animation-mixer');
        btnAnimacion.textContent = '▶️ Vivir';
      }
    });

    // GRABAR
    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false, grabadora = null;
    btnGrabar.addEventListener('click', async () => {
      if (!grabando) {
        try {
          const flujo = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false});
          grabadora = new MediaRecorder(flujo);
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, {type: 'video/webm'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `perene-${modeloActivo}-${Date.now()}.webm`;
            a.click();
            flujo.getTracks().forEach(t => t.stop());
          };
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
        } catch {
          alert('Permite grabar pantalla cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });
  </script>
</body>
</html>
