<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Permissions-Policy" content="camera=()">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  
  <style>
    * { 
      margin: 0 !important; 
      padding: 0 !important; 
      box-sizing: border-box !important; 
      border: none !important;
      outline: none !important;
    }
    html, body {
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000 !important;
      border: none !important;
    }

    /* Botón Volver */
    .btn-volver {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #006633;
      color: white !important;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 99999;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Mensaje de guía */
    .mensaje-guia {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 99999;
      text-align: center;
      max-width: 85%;
      line-height: 1.4;
    }

    /* Escena SIN bordes ni líneas */
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      outline: none !important;
    }

    /* Video de cámara SIN recortes ni líneas */
    .arjs-video, video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      z-index: 1;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      outline: none !important;
    }

    canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    /* Quitar TODO lo que sobra */
    .a-enter-vr, .arjs-loader, .arjs-debugui, .a-enter-ar, .ar-shadows {
      display: none !important;
      border: none !important;
    }
    
    /* Eliminar cualquier línea blanca */
    body::before, body::after, 
    a-scene::before, a-scene::after,
    video::before, video::after {
      display: none !important;
      content: none !important;
    }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver la información</div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; logarithmicDepthBuffer: true;">

    <a-assets>
    </a-assets>

    <a-entity id="ra-contenido">
      <a-text
        value="¡Atractivo Detectado!"
        color="#ffffff"
        align="center"
        position="0 0.5 -1"
        scale="0.5 0.5 0.5"
        font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt">
      </a-text>
    </a-entity>

    <a-camera position="0 0 0"></a-camera>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } } 
      })
        .then(function(stream) {
          console.log('✅ Cámara activada');
        })
        .catch(function(err) {
          console.log('❌ Error de cámara:', err);
        });
    });
  </script>
</body>
</html>
