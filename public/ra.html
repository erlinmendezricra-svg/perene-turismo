<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Realidad Aumentada - Perené</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body { background-color: transparent; }

    /* Botón Volver */
    .btn-volver {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #006633;
      color: white !important;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 10000;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Mensaje de guía */
    .mensaje-guia {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 10000;
      text-align: center;
      max-width: 85%;
    }

    /* Asegurar que la cámara se vea */
    a-scene {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
    .arjs-video, video, canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver la información</div>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <!-- Aquí puedes poner tus imágenes o modelos -->
    </a-assets>

    <!-- Tu contenido que aparece al detectar -->
    <a-entity id="contenido-ra" position="0 0 0" scale="1 1 1">
      <!-- Aquí van tus textos, imágenes o modelos que quieres mostrar -->
    </a-entity>

    <a-camera position="0 0 0"></a-camera>
  </a-scene>
</body>
</html>
