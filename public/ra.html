<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .fondo-camara {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .btn-volver {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #006633;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.85rem;
    }
    .mensaje-guia {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 999;
      text-align: center;
      max-width: 85%;
    }
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }
    .a-enter-vr, .arjs-loader, .arjs-video { display: none !important; }
  </style>
</head>
<body>
  <video class="fondo-camara" autoplay playsinline muted id="camara"></video>

  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver el modelo</div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <a-asset-item id="modelo-animal" src="/ar/logo.glb"></a-asset-item>
    </a-assets>

    <a-entity scale="0.6 0.6 0.6" position="0 0 -1.5">
      <a-gltf-model src="#modelo-animal"></a-gltf-model>
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
    })
    .then(function(stream) {
      const video = document.getElementById('camara');
      video.srcObject = stream;
      video.play();
    })
    .catch(function(err) {
      console.log('Error:', err);
    });
  </script>
</body>
</html>
