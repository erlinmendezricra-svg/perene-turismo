<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Realidad Aumentada - Perené</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #000 !important;
    }
    /* Botón Volver */
    .btn-volver {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #006633;
      color: white !important;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 9999;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    /* Mensaje de guía */
    .mensaje-guia {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 9999;
      text-align: center;
      max-width: 85%;
      line-height: 1.4;
    }
    /* Contenedor de cámara - PANTALLA COMPLETA */
    #ar-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000;
    }
    /* Forzar video y canvas al tamaño exacto */
    video, canvas, .arjs-video, .a-canvas, .ar-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }
    /* Ocultar cualquier contenido extra */
    body > * {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver la información</div>
  
  <div id="ar-container">
    <!-- AQUÍ VA TU CÓDIGO DE REALIDAD AUMENTADA -->
    <!-- Mantén tu código de AR.js / A-Frame aquí debajo -->
    
    <!-- Ejemplo base (mantén tu código): -->
    <!--
    <a-scene ...>
      ... tu código ...
    </a-scene>
    -->
  </div>
</body>
</html>
