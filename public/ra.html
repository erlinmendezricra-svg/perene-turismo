<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #000;
      position: fixed;
      top: 0;
      left: 0;
    }

    .btn-volver {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #006633;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      z-index: 99999;
      font-size: 0.85rem;
    }

    .mensaje-guia {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 99999;
      text-align: center;
      max-width: 85%;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      margin: 0;
      padding: 0;
    }

    .arjs-video, video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .a-enter-vr, .arjs-loader { display: none !important; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>
  
  <div class="mensaje-guia">📷 Apunta a la imagen del atractivo para ver la información</div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets></a-assets>

    <!-- Información que aparece al detectar -->
    <a-entity id="info-atractivo" position="0 0 0" scale="0.8 0.8 0.8">
      <a-text
        value="Catarata de Perené"
        color="#ffffff"
        align="center"
        position="0 1.0 -1.5"
        scale="0.5 0.5 0.5"
        font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt">
      </a-text>
      <a-text
        value="Hermosa catarata natural ubicada en Perené"
        color="#f0f0f0"
        align="center"
        position="0 0.5 -1.5"
        scale="0.25 0.25 0.25"
        width="6"
        font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt">
      </a-text>
    </a-entity>

    <a-camera position="0 0 0"></a-camera>
  </a-scene>
</body>
</html>
