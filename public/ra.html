<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Perené</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      display: block !important;
    }
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 2 !important;
      background: transparent !important;
    }
    .a-enter-vr, .arjs-loader { display: none !important; }

    .btn-volver {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      background: #006633;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      z-index: 999;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
    }

    .selector-animal {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }
    .btn-elegir {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      min-width: 180px;
    }
    .lista-animales {
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border-radius: 12px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .lista-animales.mostrar { display: flex; }
    .opcion-animal {
      background: transparent;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
    }
    .opcion-animal:hover, .opcion-animal.activo {
      background: rgba(255,255,255,0.2);
    }

    .panel-mover {
      position: fixed;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 999;
    }
    .panel-girar {
      position: fixed;
      bottom: calc(max(80px, env(safe-area-inset-bottom)) + 5px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 999;
    }
    .panel-acciones {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 999;
    }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      touch-action: manipulation;
      z-index: 999;
    }
    .btn:active { transform: scale(0.95); }
    .btn-mover { background: #0891b2; color: white; }
    .btn-girar { background: #7c3aed; color: white; }
    .btn-anim { background: #2563eb; color: white; }
    .btn-grabar { background: #dc2626; color: white; }
  </style>
</head>
<body>
  <a href="/" class="btn-volver">← Volver</a>

  <div class="selector-animal">
    <button class="btn-elegir" id="btnElegir">🦁 Leona ▾</button>
    <div class="lista-animales" id="listaAnimales">
      <button class="opcion-animal activo" data-animal="leona">🦁 Leona</button>
      <button class="opcion-animal" data-animal="saurio">🦖 Saurio</button>
      <button class="opcion-animal" data-animal="lobo">🐺 Lobo</button>
      <button class="opcion-animal" data-animal="cocodrilo">🐊 Cocodrilo</button>
      <button class="opcion-animal" data-animal="conejo">🐰 Conejo</button>
    </div>
  </div>

  <div class="panel-mover">
    <button class="btn btn-mover" id="btnArriba">⬆️</button>
    <button class="btn btn-mover" id="btnIzquierda">⬅️</button>
    <button class="btn btn-mover" id="btnAcercar">🔍+</button>
    <button class="btn btn-mover" id="btnDerecha">➡️</button>
    <button class="btn btn-mover" id="btnAbajo">⬇️</button>
    <button class="btn btn-mover" id="btnAlejar">🔍-</button>
  </div>

  <div class="panel-girar">
    <button class="btn btn-girar" id="btnGirarIzq">↺ Izq</button>
    <button class="btn btn-girar" id="btnFrente">🔄 Frente</button>
    <button class="btn btn-girar" id="btnGirarDer">↻ Der</button>
  </div>

  <div class="panel-acciones">
    <button class="btn btn-anim" id="btnAnimacion">⏸ Quieto</button>
    <button class="btn btn-grabar" id="btnGrabar">⏺ Grabar</button>
  </div>

  <a-scene
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; logarithmicDepthBuffer: true;">

    <a-assets timeout="60000">
      <a-asset-item id="leona" src="/ar/leona.glb"></a-asset-item>
      <a-asset-item id="saurio" src="/ar/saurio.glb"></a-asset-item>
      <a-asset-item id="lobo" src="/ar/lobo.glb"></a-asset-item>
      <a-asset-item id="cocodrilo" src="/ar/cocodrilo.glb"></a-asset-item>
      <a-asset-item id="conejo" src="/ar/conejo.glb"></a-asset-item>
    </a-assets>

    <a-entity id="entidadLeona" scale="0.8 0.8 0.8" position="0 0 -2.0" rotation="0 0 0" gltf-model="#leona" animation-mixer="loop: repeat; timeScale: 1.0"></a-entity>
    <a-entity id="entidadSaurio" scale="0.8 0.8 0.8" position="0 0 -2.0" rotation="0 0 0" gltf-model="#saurio" visible="false" animation-mixer="loop: repeat; timeScale: 1.0"></a-entity>
    <a-entity id="entidadLobo" scale="0.8 0.8 0.8" position="0 0 -2.0" rotation="0 0 0" gltf-model="#lobo" visible="false" animation-mixer="loop: repeat; timeScale: 1.0"></a-entity>
    <a-entity id="entidadCocodrilo" scale="0.8 0.8 0.8" position="0 0 -2.0" rotation="0 0 0" gltf-model="#cocodrilo" visible="false" animation-mixer="loop: repeat; timeScale: 1.0"></a-entity>
    <a-entity id="entidadConejo" scale="0.8 0.8 0.8" position="0 0 -2.0" rotation="0 0 0" gltf-model="#conejo" visible="false" animation-mixer="loop: repeat; timeScale: 1.0"></a-entity>

    <a-camera far="100" near="0.1" fov="60"></a-camera>
  </a-scene>

  <script>
    const entidades = {
      leona: document.getElementById('entidadLeona'),
      saurio: document.getElementById('entidadSaurio'),
      lobo: document.getElementById('entidadLobo'),
      cocodrilo: document.getElementById('entidadCocodrilo'),
      conejo: document.getElementById('entidadConejo')
    };

    const btnElegir = document.getElementById('btnElegir');
    const listaAnimales = document.getElementById('listaAnimales');
    const opciones = document.querySelectorAll('.opcion-animal');
    const btnAnimacion = document.getElementById('btnAnimacion');

    let modeloActivo = 'leona';
    let posX = 0, posY = 0, posZ = -2.0;
    let rotacionY = 0;
    let animacionActiva = true;

    btnElegir.addEventListener('click', (e) => {
      e.stopPropagation();
      listaAnimales.classList.toggle('mostrar');
    });
    document.addEventListener('click', () => listaAnimales.classList.remove('mostrar'));
    listaAnimales.addEventListener('click', e => e.stopPropagation());

    opciones.forEach(opcion => {
      opcion.addEventListener('click', () => {
        const animal = opcion.dataset.animal;
        
        Object.keys(entidades).forEach(clave => {
          entidades[clave].setAttribute('visible', 'false');
        });
        opciones.forEach(opt => opt.classList.remove('activo'));

        entidades[animal].setAttribute('visible', 'true');
        opcion.classList.add('activo');
        modeloActivo = animal;
        btnElegir.textContent = opcion.textContent + ' ▾';
        listaAnimales.classList.remove('mostrar');

        if (animacionActiva) {
          entidades[modeloActivo].setAttribute('animation-mixer', 'loop: repeat; timeScale: 1.0');
        }
      });
    });

    function actualizarPosicion() {
      entidades[modeloActivo].setAttribute('position', `${posX} ${posY} ${posZ}`);
      entidades[modeloActivo].setAttribute('rotation', `0 ${rotacionY} 0`);
    }

    document.getElementById('btnGirarIzq').addEventListener('click', () => { rotacionY -= 30; actualizarPosicion(); });
    document.getElementById('btnGirarDer').addEventListener('click', () => { rotacionY += 30; actualizarPosicion(); });
    document.getElementById('btnFrente').addEventListener('click', () => { rotacionY = 0; actualizarPosicion(); });

    document.getElementById('btnArriba').addEventListener('click', () => { posY += 0.15; actualizarPosicion(); });
    document.getElementById('btnAbajo').addEventListener('click', () => { posY -= 0.15; actualizarPosicion(); });
    document.getElementById('btnIzquierda').addEventListener('click', () => { posX -= 0.15; actualizarPosicion(); });
    document.getElementById('btnDerecha').addEventListener('click', () => { posX += 0.15; actualizarPosicion(); });
    document.getElementById('btnAcercar').addEventListener('click', () => { posZ += 0.15; actualizarPosicion(); });
    document.getElementById('btnAlejar').addEventListener('click', () => { posZ -= 0.15; actualizarPosicion(); });

    btnAnimacion.addEventListener('click', () => {
      animacionActiva = !animacionActiva;
      if (animacionActiva) {
        entidades[modeloActivo].setAttribute('animation-mixer', 'loop: repeat; timeScale: 1.0');
        btnAnimacion.textContent = '⏸ Quieto';
      } else {
        entidades[modeloActivo].removeAttribute('animation-mixer');
        btnAnimacion.textContent = '▶️ Vivir';
      }
    });

    const btnGrabar = document.getElementById('btnGrabar');
    let grabando = false, grabadora = null;
    btnGrabar.addEventListener('click', async () => {
      if (!grabando) {
        try {
          const flujo = await navigator.mediaDevices.getDisplayMedia({video: true, audio: false});
          grabadora = new MediaRecorder(flujo);
          const trozos = [];
          grabadora.ondataavailable = e => e.data.size && trozos.push(e.data);
          grabadora.onstop = () => {
            const blob = new Blob(trozos, {type: 'video/webm'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `perene-${modeloActivo}-${Date.now()}.webm`;
            a.click();
            flujo.getTracks().forEach(t => t.stop());
          };
          grabadora.start();
          grabando = true;
          btnGrabar.classList.add('grabando');
          btnGrabar.textContent = '⏹ Detener';
        } catch {
          alert('Permite grabar pantalla cuando el navegador lo pide');
        }
      } else {
        grabadora.stop();
        grabando = false;
        btnGrabar.classList.remove('grabando');
        btnGrabar.textContent = '⏺ Grabar';
      }
    });
  </script>
</body>
</html>
